name: Server preflight checks

on:
  push:
    branches:
      - fix/runtime-preflight-and-lfs
  pull_request:

jobs:
  preflight:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile restore utility
        run: python -m py_compile GitCompression/RestoreLFS.py

      - name: Run restore utility tests
        run: python -m unittest discover -s GitCompression -p "test_*.py" -v

      - name: Validate server XML configurations
        run: python -m unittest discover -s GitCompression -p "test_config_*.py" -v
